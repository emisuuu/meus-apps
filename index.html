<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu App - Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #e2e8f0;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --border: #334155;
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow);
      transition: all 0.3s;
    }

    .app-icon {
      width: 96px;
      height: 96px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 22px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: white;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .version {
      display: inline-block;
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .description {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      padding: 16px 32px;
      border-radius: 14px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    .download-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }

    .download-btn:active {
      transform: translateY(0);
    }

    .info {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }
      
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Meus Apps</div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">
      <span id="theme-icon">🌙</span>
    </button>
  </header>

  <main>
    <div class="card">
      <div class="app-icon">📱</div>
      
      <h1>Nome do Seu App</h1>
      <div class="version">v1.0.0</div>
      
      <p class="description">
        Descrição curta e atrativa do seu aplicativo. Explique o que ele faz de forma clara e objetiva.
      </p>
      
      <!-- TROQUE O LINK ABAIXO PELO LINK DO SEU APK NO GITHUB RELEASES -->
      <a href="https://github.com/emisuuu/meus-apps/releases/download/v1.0.0/Graficos.PES.14.apk" class="download-btn" download>
        <span>⬇️</span>
        Baixar APK
      </a>
      
      <div class="info">
        Android 8.0+ • Tamanho aproximado: XX MB
      </div>
    </div>
  </main>

  <footer>
    Feito com ❤️ • 2026
  </footer>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      
      if (html.getAttribute('data-theme') === 'dark') {
        html.removeAttribute('data-theme');
        icon.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        icon.textContent = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    // Carrega o tema salvo
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      document.getElementById('theme-icon').textContent = '☀️';
    }
  </script>
</body>
</html>
